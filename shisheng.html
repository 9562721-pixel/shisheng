<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280" />
<title>识生</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3eee4;
    --surface: #fffbf5;
    --fg: #1a1814;
    --muted: #6f6a62;
    --subtle: #9a948a;
    --border: #e4dcd0;
    --primary: #245c45;
    --primary-fg: #f3eee4;
    --clay: #8b3a2a;
    --shadow: 0 1px 0 rgb(26 24 20 / 0.04), 0 18px 40px rgb(26 24 20 / 0.08);
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); }
  button, a { cursor: pointer; }
  button { font: inherit; color: inherit; }
  img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .app { display: flex; min-height: 100vh; }
  aside.nav {
    position: sticky; top: 0; height: 100vh; width: 208px; flex: none;
    display: flex; flex-direction: column; gap: 4px;
    padding: 20px 12px; border-right: 1px solid var(--border); background: var(--surface);
  }
  .brand { display: block; padding: 0 8px 16px; color: inherit; text-decoration: none; }
  .brand small { letter-spacing: 0.18em; color: var(--muted); font-size: 12px; }
  .brand strong { display: block; font-family: "Songti SC", "STSong", serif; font-size: 28px; font-weight: 600; }
  .nav a.item {
    display: flex; flex-direction: column; gap: 4px; padding: 10px 8px; border-radius: 8px;
    color: inherit; text-decoration: none;
  }
  .nav a.item:hover { background: var(--bg); }
  .nav a.item.on { background: var(--primary); color: var(--primary-fg); }
  .nav a.item span { font-size: 12px; color: var(--muted); }
  .nav a.item.on span { color: rgb(243 238 228 / 0.75); }
  .nav .hint { margin-top: auto; padding: 8px; font-size: 12px; line-height: 1.5; color: var(--subtle); }
  .nav .sign { margin: 2px 8px 0; font-size: 11px; letter-spacing: 0.04em; color: var(--subtle); }
  .fixrow { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; max-width: 880px; margin: 0 0 12px; padding: 12px; background: var(--surface); border-radius: 12px; box-shadow: inset 0 0 0 1px var(--border); }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fields label, .checks label { font-size: 12px; color: var(--muted); }
  .fields label { display: flex; flex-direction: column; gap: 4px; }
  .checks { display: flex; gap: 16px; align-items: center; margin: 8px 0; font-size: 14px; color: var(--fg); }
  .warn { color: var(--clay); font-size: 12px; }
  main { flex: 1; min-width: 0; padding: 28px 32px 48px; }
  h1, h2 { font-family: "Songti SC", "STSong", serif; font-weight: 600; margin: 0; }
  .muted { color: var(--muted); }
  .row { display: flex; gap: 12px; align-items: center; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; max-width: 1080px; }
  .stack { display: flex; flex-direction: column; gap: 12px; max-width: 560px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 12px; padding: 14px 18px; text-decoration: none;
    background: var(--primary); color: var(--primary-fg); font-size: 16px;
  }
  .btn.block { width: 100%; justify-content: space-between; text-align: left; }
  .btn.ghost { background: var(--surface); color: var(--fg); box-shadow: inset 0 0 0 1px var(--border); }
  .btn.again { background: #efeae2; color: var(--fg); }
  .btn.hard { background: #f6ebe7; color: var(--clay); box-shadow: inset 0 0 0 1px rgb(139 58 42 / 0.2); }
  .btn:active { transform: scale(0.98); }
  .card { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .card p { margin: 0; padding: 10px 12px; text-align: center; font-size: 14px; line-height: 1.5; }
  .photo { aspect-ratio: 3/4; background: var(--border); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--surface); border-radius: 12px; padding: 12px; box-shadow: inset 0 0 0 1px var(--border); }
  .stat b { display: block; font-family: "Songti SC", serif; font-size: 28px; }
  .stat span { color: var(--muted); font-size: 12px; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .check { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border-radius: 12px; padding: 12px 16px; box-shadow: inset 0 0 0 1px var(--border); }
  .drill { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 32px; max-width: 960px; align-items: start; }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 520px; margin-top: 24px; }
  .faces { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 880px; }
  .faces button { padding: 0; border: 2px solid transparent; border-radius: 12px; overflow: hidden; background: none; }
  .faces button.ok { border-color: var(--primary); }
  .faces button.bad { border-color: var(--clay); }
  .roster { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; max-width: 1100px; }
  .roster button { padding: 0 0 8px; border: 0; text-align: left; background: var(--surface); border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--border); }
  .roster button p { margin: 8px 8px 0; font-size: 12px; line-height: 1.45; }
  .drop { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 120px; padding: 16px; text-align: center; border: 1px dashed var(--border); border-radius: 12px; background: var(--surface); }
  input[type="search"], input[type="text"] { width: 100%; height: 40px; border: 0; border-radius: 8px; padding: 0 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); }
  .filters { display: flex; gap: 8px; margin: 12px 0; }
  .filters button { border: 0; border-radius: 999px; padding: 6px 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); }
  .filters button.on { background: var(--primary); color: var(--primary-fg); }
  kbd { font: inherit; opacity: 0.7; font-size: 12px; }
</style>
</head>

  </aside>

</div>

<script>
const SEED = JSON.parse(document.getElementById("seed").textContent);
const KEY = "shisheng-html-v1";

function load() {
  try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; }
}
function persist() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch {
    alert("这台浏览器存不下这次更正了。");
  }
}

const saved = load();
let state = {
  srs: saved.srs || {},
  custom: saved.custom || [],
  flags: saved.flags || {},
  fixes: saved.fixes || {},
  useDemo: !!saved.useDemo,
  hideSeed: !!saved.hideSeed,
  coldFirst: saved.coldFirst !== false,
  exams: saved.exams || [],
};
let session = null;
let linked = { name: "", students: [], busy: "" };

function roster() {
  if (linked.students.length && !state.useDemo) {
    return linked.students.map((s) => ({ ...s, rarelySeen: !!(state.flags[s.id] ?? s.rarelySeen) }));
  }
  const seed = state.hideSeed ? [] : SEED.map((s) => ({ ...s, rarelySeen: state.flags[s.id] ?? s.rarelySeen }));
  return seed.concat(state.custom.filter((s) => s.photo));
}
function pendingList() {
  return linked.students.filter((s) => !s.sure);
}
function caption(s) {
  const needy = s.needyLabel || (s.needy ? "困难" : "非困难");
  const psych = s.psychLabel || (s.psychFocus ? "心理关注" : "无关注");
  if (s.studentNo) return [s.className, s.name, s.studentNo, needy, psych, s.hometown].filter(Boolean).join("  ");
  return [s.name, s.className, needy, psych, s.hometown].filter(Boolean).join("  ");
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => {
    if (c === "&") return "\u0026amp;";
    if (c === "<") return "\u0026lt;";
    if (c === ">") return "\u0026gt;";
    if (c === '"') return "\u0026quot;";
    return "\u0026#39;";
  });
}
function shuffle(list) {
  const next = list.slice();
  for (let i = next.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [next[i], next[j]] = [next[j], next[i]];
  }
  return next;
}
function mastery(card) {
  if (!card || !card.seen) return "new";
  if (card.reps >= 3 && card.ease >= 2.3 && card.lapses < 2) return "mastered";
  if (card.lapses >= 2 || card.reps === 0) return "weak";
  return "learning";
}
function review(card, rating) {
  const next = { ease: 2.5, interval: 0, reps: 0, lapses: 0, due: 0, seen: 0, ...(card || {}) };
  next.seen += 1;
  const now = Date.now();
  if (rating === "again") {
    next.reps = 0; next.lapses += 1; next.ease = Math.max(1.3, next.ease - 0.2); next.due = now + 8 * 60 * 1000;
  } else if (rating === "hard") {
    next.reps += 1; next.ease = Math.max(1.3, next.ease - 0.15);
    next.interval = Math.max(1, Math.round((next.interval || 1) * 1.2));
    next.due = now + next.interval * 86400000;
  } else {
    next.reps += 1;
    next.interval = next.reps === 1 ? 1 : next.reps === 2 ? 3 : Math.max(4, Math.round(next.interval * next.ease));
    next.due = now + next.interval * 86400000;
  }
  return next;
}
function buildQueue(opts) {
  const now = Date.now();
  let pool = roster();
  if (opts.confuse) pool = pool.filter((s) => s.confuseGroups.length);
  const ranked = pool.map((student) => {
    const card = state.srs[student.id];
    let score = Math.random();
    if (!card || !card.seen) score += 48;
    if (student.rarelySeen) score += 42;
    if (card && card.due <= now) score += 28;
    if (mastery(card) === "weak") score += 36;
    if (student.psychFocus || student.needy) score += 8;
    return { student, score };
  }).sort((a, b) => b.score - a.score);
  let list = ranked;
  if (opts.cold) {
    list = ranked.filter((x) => x.student.rarelySeen).concat(ranked.filter((x) => !x.student.rarelySeen));
  }
  const out = list.slice(0, opts.count || 10).map((x) => x.student);
  return out.length ? out : roster().slice(0, opts.count || 10);
}
function choicesFor(target) {
  const all = roster().filter((s) => s.id !== target.id);
  const similar = all.filter((s) => s.confuseGroups.some((g) => target.confuseGroups.includes(g)));
  const rest = all.filter((s) => !similar.includes(s));
  return shuffle([target].concat(shuffle(similar.concat(rest)).slice(0, 3)));
}
function stats() {
  const out = { mastered: 0, learning: 0, unseen: 0, cold: 0, total: 0 };
  for (const s of roster()) {
    out.total += 1;
    const m = mastery(state.srs[s.id]);
    if (m === "mastered") out.mastered += 1;
    else if (m === "new") { out.unseen += 1; if (s.rarelySeen) out.cold += 1; }
    else out.learning += 1;
  }
  return out;
}
function photo(src) {
  return `<div class="photo"><img alt="" src="${src}"></div>`;
}
function route() {
  const hash = location.hash.replace(/^#\/?/, "");
  return hash.split("?")[0] || "home";
}
function go(path) {
  if (path === "drill" || path === "exam" || path === "reverse" || path === "confuse") start(path);
  location.hash = "#/" + (path === "home" ? "" : path);
}
function start(mode) {
  const queue = buildQueue({
    count: mode === "reverse" || mode === "confuse" ? 8 : 10,
    cold: mode === "drill" && state.coldFirst,
    confuse: mode === "confuse",
  });
  const student = queue[0];
  session = {
    mode, queue, index: 0, phase: "recall", results: [], elapsed: 0,
    picked: null, choices: student ? choicesFor(student) : [],
    face: Math.random() > 0.5,
    started: Date.now(),
  };
}
function rateCurrent(rating) {
  const s = session.queue[session.index];
  if (!s) return;
  state.srs[s.id] = review(state.srs[s.id], rating);
  session.results.push({ id: s.id, rating });
  persist();
  if (session.index + 1 >= session.queue.length) {
    if (session.mode === "exam") {
      const good = session.results.filter((r) => r.rating === "good").length;
      state.exams.unshift({ score: good * 5, total: session.results.length * 5 });
      state.exams = state.exams.slice(0, 8);
      persist();
    }
    session.phase = "done";
  } else {
    session.index += 1;
    session.phase = "recall";
    session.picked = null;
    session.choices = choicesFor(session.queue[session.index]);
    if (session.mode === "confuse") session.face = !session.face;
    session.started = Date.now();
  }
  render();
}

function home() {
  const st = stats();
  const sample = roster().find((s) => s.rarelySeen) || roster()[0];
  const last = state.exams[0];
  return `
    <div class="grid2">
      <div class="stack">
        <p class="muted">双击这个 HTML 就能背。对着脸说，空格揭晓。</p>
        <h1 style="font-size:52px">识生</h1>
        <p class="muted">${st.total} 人 · ${sourceLabel()}${last ? ` · 上次模考 ${last.score}/${last.total}` : ""}</p>
        <a class="btn block" href="#/drill"><span>开始看图口答<br><small>${state.coldFirst ? "冷门优先" : "全员混合"} · 10 人</small></span><span>${st.cold} 未练</span></a>
        <label class="check">冷门优先<input type="checkbox" id="cold" ${state.coldFirst ? "checked" : ""}></label>
        <div class="modes">
          <a class="btn ghost" href="#/reverse">反背<br><small class="muted">看名选脸</small></a>
          <a class="btn ghost" href="#/confuse">易混<br><small class="muted">长得像</small></a>
          <a class="btn ghost" href="#/exam">模考<br><small class="muted">抽 10 张</small></a>
        </div>
        <div class="stats">
          <div class="stat"><b>${st.mastered}</b><span>已掌握</span></div>
          <div class="stat"><b>${st.learning}</b><span>在练</span></div>
          <div class="stat"><b>${st.unseen}</b><span>未开口</span></div>
        </div>
        <p class="muted" style="font-size:12px">1 认不出 · 2 漏字段 · 3 全对。困难、心理只存在这台电脑。</p>
      </div>
      <div>
        ${sample ? `<div class="card">${photo(sample.photo)}<p>${esc(caption(sample))}</p></div>` : ""}
        <h2 style="margin-top:24px;font-size:20px">照片文件夹</h2>
        ${folderBox()}
      </div>
    </div>`;
}

function drillView() {
  if (!session) return `<p>这一组暂时没人。</p>`;
  if (session.phase === "done") {
    const misses = session.queue.filter((s) => session.results.some((r) => r.id === s.id && r.rating !== "good"));
    const good = session.results.filter((r) => r.rating === "good").length;
    return `<h1>${session.mode === "exam" ? `${good * 5} / ${session.results.length * 5}` : "这组练完了"}</h1>
      <p class="muted">${misses.length ? "还要再看：" + misses.map((s) => esc(s.name)).join("、") : "全对。"}</p>

function render() {

function bind(main) {
  const cold = main.querySelector("#cold");
  if (cold) cold.onchange = () => { state.coldFirst = cold.checked; persist(); render(); };
  const hide = main.querySelector("#hide");
  if (hide) hide.onchange = () => { state.hideSeed = hide.checked; persist(); render(); };
  const demo = main.querySelector("#demo");

  main.querySelectorAll("#link").forEach((btn) => { btn.onclick = () => linkFolder(); });

}

function rateCurrentHold(rating) {
  const s = session.queue[session.index];
  state.srs[s.id] = review(state.srs[s.id], rating);

  const s = roster().find((x) => x.id === id);

  const rare = confirm(`${s.name}\n${caption(s)}\n\n确定 = ${s.rarelySeen ? "取消少见面" : "标为少见面"}，取消 = 关闭`);

    state.custom = state.custom.map((x) => x.id === s.id ? { ...x, rarelySeen: !x.rarelySeen } : x);
  } else if (String(s.id).startsWith("p:")) {

const YES = /^(是|有|困难|贫困|关注|需关注|true|yes|1)$/i;

  const needyKnown = ["", "贫困", "困难", "非困难", "非贫困", "否", "无"].includes(needyRaw);
  const psychKnown = ["", "心理重点关注", "心理关注", "无关注", "无", "否"].includes(psychRaw);
  if (!needyKnown) issues.push("贫困这一格不认识：" + needyRaw);
  if (!psychKnown) issues.push("心理这一格不认识：" + psychRaw);

    studentNo,
    needy: !!needyRaw && !needyRaw.startsWith("非") && !needyRaw.startsWith("无"),
    psychFocus: !!psychRaw && !psychRaw.startsWith("无") && !psychRaw.startsWith("非"),

function parseCaption(raw) {

    }
    if (NO.test(token)) { flags.push(false); continue; }
    if (YES.test(token) || token === "困难生" || token === "贫困生") { flags.push(true); continue; }
    texts.push(token);
  }
  const classAt = texts.findIndex((item) => /班|\d{2,4}|计算机|软件|英语|法学|会计|机械|护理|临床|研/.test(item));
  if (classAt >= 0) { result.className = texts[classAt]; texts.splice(classAt, 1); }
  if (!result.name || result.className === result.name) {
    /* name stayed parts[0] */
  }
  result.hometown = texts.join("·");
  if (!result.className && /班|\d{2,4}|计算机|软件|英语|法学|会计|机械|护理|临床|研/.test(parent)) result.className = parent;
  if (!result.className) issues.push("没认出班级");

  if (flags[1] !== undefined) { result.psychFocus = flags[1]; psychSet = true; }
  if (!result.needyLabel) result.needyLabel = result.needy ? "贫困" : "非困难";
  if (!result.psychLabel) result.psychLabel = result.psychFocus ? "心理重点关注" : "无关注";

  if (!psychSet && flags[1] === undefined) issues.push("心理没写明");

}

function db() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("shisheng-folder", 1);
    req.onupgradeneeded = () => {
      const base = req.result;
      if (!base.objectStoreNames.contains("kv")) base.createObjectStore("kv");
      if (!base.objectStoreNames.contains("photos")) base.createObjectStore("photos");
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbGet(store, key) {
  return db().then((base) => new Promise((resolve, reject) => {
    const req = base.transaction(store).objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}

  return db().then((base) => new Promise((resolve, reject) => {
    const req = base.transaction(store, "readwrite").objectStore(store).put(value, key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  }));
}

      rel: s.rel, name: s.name, className: s.className, hometown: s.hometown, studentNo: s.studentNo || "",
      needy: s.needy, psychFocus: s.psychFocus, needyLabel: s.needyLabel || "", psychLabel: s.psychLabel || "",
      issues: s.issues || [], sure: !!s.sure, fixed: !!s.fixed,
    })),
  }).catch(() => {});
}
function compressFile(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, 540 / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob((blob) => { URL.revokeObjectURL(url); blob ? resolve(blob) : reject(new Error("compress")); }, "image/jpeg", 0.72);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image")); };
    img.src = url;
  });
}
async function ingestEntries(entries, folderName, quiet) {
  const total = entries.length;
  const next = [];
  const keep = new Set();
  linked.busy = `正在读取 0/${total}`;
  render();
  for (let i = 0; i < entries.length; i++) {
    const entry = entries[i];
    keep.add(entry.rel);
    try {
      const blob = await compressFile(entry.file);
      await idbSet("photos", entry.rel, blob);
      const old = linked.students.find((s) => s.rel === entry.rel);
      if (old && old.photo && String(old.photo).startsWith("blob:")) URL.revokeObjectURL(old.photo);
      next.push(studentFrom(entry.rel, applyFix(entry.rel, parseCaption(entry.rel)), URL.createObjectURL(blob)));
    } catch { /* skip unreadable */ }
    if (i % 12 === 0 || i === entries.length - 1) {
      linked.busy = `正在读取 ${i + 1}/${total}`;
      const status = document.getElementById("linkstatus");
      if (status) status.textContent = linked.busy;
    }
  }
  linked.students.filter((s) => !keep.has(s.rel)).forEach((s) => {
    if (s.photo && String(s.photo).startsWith("blob:")) URL.revokeObjectURL(s.photo);
  });
  linked.students = next.sort((a, b) => a.rel.localeCompare(b.rel, "zh"));
  linked.name = folderName;
  linked.busy = "";
  state.useDemo = false;
  persist();
  await saveMeta();
  if (!quiet) location.hash = pendingList().length ? "#/fix" : "#/roster";
  render();
}
async function collectHandle(dir, prefix, out) {
  for await (const [name, handle] of dir.entries()) {
    if (name === "__MACOSX" || name.startsWith(".")) continue;
    const rel = prefix ? `${prefix}/${name}` : name;
    if (handle.kind === "directory") {
      if (rel.split("/").length <= 3) await collectHandle(handle, rel, out);
    } else if (isPhotoRel(rel) && out.length < 2000) {
      out.push({ rel, file: await handle.getFile() });
    }
  }
}
async function linkFolder() {
  if (window.showDirectoryPicker && window.isSecureContext) {
    try {
      const handle = await window.showDirectoryPicker({ mode: "read", id: "shisheng-students" });
      await idbSet("kv", "handle", handle);
      const entries = [];
      await collectHandle(handle, "", entries);
      if (!entries.length) { alert("这个文件夹里没有照片。"); return; }
      await ingestEntries(entries, handle.name);
      return;
    } catch (error) {
      if (error && error.name === "AbortError") return;
    }
  }
  const input = document.getElementById("dirpick");
  input.value = "";
  input.click();
}
async function onDirectoryInput(event) {
  const files = [...event.target.files].filter((file) => isPhotoRel(file.webkitRelativePath || file.name));
  if (!files.length) { alert("这个文件夹里没有照片。"); return; }
  const folderName = (files[0].webkitRelativePath || files[0].name).split("/")[0];
  const entries = files.slice(0, 2000).map((file) => {
    const parts = (file.webkitRelativePath || file.name).split("/");
    return { rel: parts.slice(1).join("/") || file.name, file };
  });
  await ingestEntries(entries, folderName);
}
async function restoreLinked() {
  const meta = await idbGet("kv", "meta").catch(() => null);
  if (!meta || !meta.files || !meta.files.length) return;
  const students = [];
  for (const file of meta.files) {
    const blob = await idbGet("photos", file.rel).catch(() => null);
    if (!blob) continue;
    const parsed = applyFix(file.rel, { ...file, issues: file.issues || [], sure: !!file.sure });
    students.push(studentFrom(file.rel, parsed, URL.createObjectURL(blob)));
  }
  linked.name = meta.name || "已链接文件夹";
  linked.students = students;
}
async function resumeHandle() {
  if (!window.showDirectoryPicker || !window.isSecureContext) return;
  const handle = await idbGet("kv", "handle").catch(() => null);
  if (!handle || !handle.queryPermission) return;
  const perm = await handle.queryPermission({ mode: "read" });
  if (perm !== "granted") return;
  const here = route();
  if (here === "drill" || here === "exam" || here === "reverse" || here === "confuse") return;
  const entries = [];
  await collectHandle(handle, "", entries);
  if (entries.length) await ingestEntries(entries, handle.name, true);
}

document.addEventListener("keydown", (event) => {
  const name = route();
  if (name !== "drill" && name !== "exam") return;
  if (!session || session.phase === "done") return;
  if (event.code === "Space") { event.preventDefault(); if (session.phase === "recall") { session.phase = "reveal"; render(); } }
  if (session.phase !== "reveal" || session.mode === "exam") return;
  if (event.key === "1") rateCurrent("again");
  if (event.key === "2") rateCurrent("hard");
  if (event.key === "3") rateCurrent("good");
});
window.addEventListener("hashchange", render);

document.getElementById("dirpick").addEventListener("change", onDirectoryInput);
document.getElementById("main").textContent = "正在打开…";
restoreLinked().then(() => {
  if (!location.hash) location.hash = "#/";
  render();
  resumeHandle();
});

</script>
