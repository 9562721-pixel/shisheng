<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>识生 · 考核学习</title><style>:root {
  --bg: #f4f0e7;
  --paper: #fffdf7;
  --ink: #242b25;
  --muted: #73776d;
  --line: #dedfd3;
  --green: #245a43;
  --soft: #e5edde;
  --orange: #9b5837;
  font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--ink);
  background: var(--bg);
  font-synthesis: none;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
select {
  font: inherit;
}
button,
a,
input,
select {
  touch-action: manipulation;
}
button,
a {
  cursor: pointer;
}
button:disabled {
  opacity: 0.45;
  cursor: default;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 3px solid #bd8a40;
  outline-offset: 4px;
}
button {
  border: 0;
}
a {
  color: inherit;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1,
h2,
.serif {
  font-family: "Songti SC", "STSong", serif;
}
h1 {
  font-size: 44px;
  line-height: 1.25;
  letter-spacing: -1px;
}
h2 {
  font-size: 26px;
}
p {
  line-height: 1.7;
}
.muted,
small {
  color: var(--muted);
}
small {
  font-size: 13px;
}
.eyebrow {
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--green);
  font-weight: 700;
}
.app {
  display: flex;
  min-height: 100vh;
}
.nav {
  width: 216px;
  flex-shrink: 0;
  padding: 34px 22px;
  border-right: 1px solid var(--line);
  background: var(--paper);
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.brand {
  text-decoration: none;
  margin-bottom: 46px;
  display: block;
}
.brand b {
  font-family: "Songti SC", serif;
  font-size: 34px;
  display: block;
}
.brand small {
  font-size: 11px;
  letter-spacing: 3px;
}
.nav a.item {
  padding: 13px 16px;
  border-radius: 10px;
  text-decoration: none;
  font-size: 15px;
}
.nav a.item.on {
  background: var(--green);
  color: white;
}
.nav a.item:hover:not(.on) {
  background: var(--bg);
}
.navfooter {
  margin-top: auto;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.9;
}
.navfooter span {
  display: block;
}
.main {
  width: 100%;
  min-width: 0;
  max-width: 1400px;
  padding: 42px 54px 32px;
  margin: auto;
}
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 28px;
}
.source {
  font-size: 13px;
  padding: 7px 12px;
  border: 1px solid var(--line);
  border-radius: 30px;
  max-width: 100%;
  overflow-wrap: anywhere;
}
.hero {
  display: grid;
  grid-template-columns: 1.25fr 0.75fr;
  gap: 46px;
  align-items: center;
  margin: 24px 0 36px;
}
.hero h1 {
  font-size: clamp(34px, 4vw, 54px);
  margin: 16px 0;
}
.hero p {
  max-width: 530px;
}
.heroart {
  border: 1px solid var(--line);
  padding: 24px;
  background: var(--paper);
  border-radius: 18px;
  transform: rotate(2deg);
  box-shadow: 0 18px 44px #243b2610;
}
.steps {
  display: flex;
  gap: 8px;
  margin-top: 20px;
}
.step {
  padding: 14px 8px;
  flex: 1;
  border-top: 2px solid var(--line);
  font-size: 13px;
}
.step b {
  display: block;
  margin-top: 8px;
  font-size: 15px;
}
.step.active {
  border-color: var(--green);
  color: var(--green);
}
.btn {
  border-radius: 10px;
  background: var(--green);
  color: white;
  padding: 13px 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 15px;
  text-decoration: none;
  min-height: 46px;
}
.btn.secondary {
  background: var(--paper);
  color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--line);
}
.btn.soft {
  background: var(--soft);
  color: var(--green);
}
.btn.warn {
  background: #f0e3d7;
  color: var(--orange);
}
.btn.small {
  padding: 8px 14px;
  min-height: 36px;
  font-size: 13px;
}
.link {
  background: none;
  color: var(--muted);
  padding: 8px;
  text-decoration: underline;
}
.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 24px;
}
.metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin: 28px 0;
}
.metric {
  border-top: 1px solid var(--line);
  padding: 20px 0;
}
.metric b {
  font-family: Georgia, serif;
  font-size: 34px;
  margin-right: 9px;
  font-weight: 400;
}
.metric span {
  font-size: 14px;
  color: var(--muted);
}
.panel {
  padding: 24px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--paper);
}
.row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.between {
  justify-content: space-between;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
  font-size: 13px;
  color: var(--muted);
}
select,
input[type="text"],
input[type="search"] {
  border: 1px solid var(--line);
  background: var(--paper);
  padding: 10px 12px;
  border-radius: 8px;
  color: var(--ink);
  max-width: 100%;
  min-height: 43px;
}
input[type="search"] {
  width: 300px;
}
.controls {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin: 22px 0;
}
.notice {
  padding: 12px 16px;
  border-left: 3px solid #ba8054;
  background: #f0e5d8;
  font-size: 14px;
  margin: 20px 0;
  line-height: 1.7;
}
.notice a {
  text-decoration: underline;
}
.progress {
  height: 4px;
  background: var(--line);
  border-radius: 4px;
  overflow: hidden;
  margin: 14px 0 24px;
}
.progress span {
  display: block;
  background: var(--green);
  height: 100%;
  transition: width 0.2s;
}
.learn {
  display: grid;
  grid-template-columns: minmax(220px, 340px) minmax(0, 1fr);
  gap: 48px;
  align-items: start;
  max-width: 980px;
  margin: 0 auto;
}
.portrait {
  background: #e9e7de;
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  aspect-ratio: 3/4;
}
.portrait img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
.photo-label {
  padding: 12px 4px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
}
.answer {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 22px;
}
.answer .datum {
  padding: 15px 16px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 10px;
  min-width: 0;
  text-align: left;
  color: var(--ink);
}
.datum small {
  display: block;
  margin-bottom: 7px;
}
.datum b {
  font-size: 21px;
  line-height: 1.5;
  font-weight: 500;
  overflow-wrap: anywhere;
}
.datum.name {
  grid-column: 1/-1;
}
.datum.name b {
  font-family: "Songti SC", serif;
  font-size: 32px;
}
.datum.miss {
  border-color: var(--orange);
  background: #f4e8df;
}
.datum input {
  accent-color: var(--orange);
  margin-right: 5px;
}
.recallhint {
  padding: 42px 0 26px;
}
.recallhint h2 {
  font-size: 34px;
  margin-bottom: 18px;
}
.pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
}
.pill {
  border: 1px solid var(--line);
  padding: 7px 12px;
  border-radius: 30px;
  font-size: 13px;
  color: var(--muted);
}
.roster {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
  gap: 18px;
  margin-top: 24px;
}
.student {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  min-width: 0;
}
.student .portrait {
  border: 0;
  border-radius: 0;
}
.student .info {
  padding: 13px;
  overflow-wrap: anywhere;
}
.student h3 {
  font-size: 17px;
  margin-bottom: 4px;
}
.student p {
  font-size: 12px;
}
.student .btn {
  margin-top: 10px;
  width: 100%;
}
.error {
  color: #a04228;
}
.empty {
  padding: 60px 20px;
  text-align: center;
  border: 1px dashed var(--line);
  border-radius: 16px;
}
.empty h2 {
  margin-bottom: 12px;
}
.result {
  max-width: 760px;
  margin: 34px auto;
}
.result h1 {
  margin-bottom: 16px;
}
.resultlist {
  list-style: none;
  padding: 0;
  margin: 25px 0;
}
.resultlist li {
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 14px;
}
.modegrid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 25px 0;
}
.mode {
  padding: 24px 18px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  text-align: left;
  color: var(--ink);
}
.mode.on {
  border: 2px solid var(--green);
  background: var(--soft);
}
.mode b {
  display: block;
  font-size: 19px;
  margin-bottom: 8px;
}
.mode p {
  font-size: 13px;
  color: var(--muted);
}
.librarylist {
  display: grid;
  gap: 12px;
  margin: 20px 0;
}
.help {
  max-width: 760px;
}
.help h2 {
  margin: 28px 0 12px;
}
.help p {
  margin-bottom: 12px;
}
.help li {
  line-height: 1.9;
}
dialog {
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 28px;
  background: var(--bg);
  color: var(--ink);
  width: min(680px, 92vw);
  max-height: 90vh;
  overflow: auto;
}
dialog::backdrop {
  background: #16291f55;
}
.editgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: 20px 0;
}
.editgrid input {
  width: 100%;
}
.toast {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: white;
  border-radius: 10px;
  padding: 13px 22px;
  z-index: 100;
  max-width: 90vw;
  font-size: 14px;
}
.status {
  font-size: 12px;
  color: var(--muted);
  margin-top: 20px;
  min-height: 20px;
}
.busy {
  position: fixed;
  inset: 0;
  background: #f4f0e7ee;
  z-index: 90;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.busy .panel {
  min-width: 320px;
}
.busy p {
  margin-top: 16px;
}
kbd {
  font-size: 11px;
  font-family: inherit;
  opacity: 0.7;
}
.hidden {
  display: none !important;
}
@media (max-width: 1000px) {
  .main {
    padding: 28px;
  }
  .nav {
    width: 176px;
    padding: 28px 14px;
  }
  .learn {
    gap: 26px;
    grid-template-columns: minmax(200px, 280px) minmax(0, 1fr);
  }
  .hero {
    gap: 24px;
  }
  .answer {
    gap: 8px;
  }
  .datum b {
    font-size: 18px;
  }
}
@media (max-width: 720px) {
  .app {
    display: block;
  }
  .nav {
    height: auto;
    width: 100%;
    position: static;
    padding: 14px;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 4px;
    border-bottom: 1px solid var(--line);
    border-right: 0;
  }
  .brand {
    margin: 0 auto 0 0;
  }
  .brand b {
    font-size: 24px;
  }
  .brand small,
  .navfooter {
    display: none;
  }
  .nav a.item {
    padding: 10px;
    font-size: 13px;
  }
  .main {
    padding: 22px 18px;
  }
  .hero {
    grid-template-columns: 1fr;
    margin-top: 0;
  }
  .heroart {
    display: none;
  }
  .hero h1 {
    font-size: 38px;
  }
  .learn {
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .learn .portrait {
    max-width: 260px;
    margin: auto;
  }
  .photo-label {
    text-align: center;
  }
  .answer {
    margin-top: 14px;
  }
  .modegrid {
    gap: 8px;
  }
  .mode {
    padding: 16px 10px;
  }
  .mode b {
    font-size: 16px;
  }
  .top {
    gap: 10px;
    align-items: flex-start;
  }
  .top h1 {
    font-size: 30px;
  }
  .metrics {
    gap: 8px;
  }
  .metric b {
    font-size: 27px;
  }
  .metric span {
    display: block;
    font-size: 12px;
  }
  .editgrid {
    grid-template-columns: 1fr;
  }
  .recallhint {
    padding: 10px 0;
  }
  .roster {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}

let hostPort=null;
const waiting=new Map();
function hostSave(state) {
  return new Promise((resolve,reject)=>{
    const requestId=uid();
    const timeout=setTimeout(()=>{waiting.delete(requestId);reject(new Error("保存尚未确认，请重试或返回考核材料导出备份"));},15000);
    waiting.set(requestId,{resolve,reject,timeout});
    const library=state.libraries.find(x=>x.id==="workbench");
    hostPort.postMessage({type:"save",requestId,state:{progress:library?.progress||{},session:library?.session||null,exams:library?.exams||[],settings:state.settings,signatures:state.linkedSignatures||{},studyPlans:state.studyPlans||[],activePlanId:state.activePlanId||""}});
  });
}
function localConfirm(message) {
  return new Promise(resolve=>{
    const dialog=document.getElementById("confirm-dialog");
    dialog.querySelector("p").textContent=message;
    dialog.returnValue="";
    // The practice iframe intentionally disallows form submissions.
    // Close the dialog explicitly so confirmation also works inside its sandbox.
    dialog.onclick=event=>{
      const button=event.target.closest("button[value]");
      if(button && dialog.contains(button))dialog.close(button.value);
    };
    dialog.onclose=()=>{dialog.onclick=null;dialog.onclose=null;resolve(dialog.returnValue==="continue");};
    dialog.showModal();
  });
}
async function linkedBoot() {
  window.addEventListener("message",function initialise(event){
    if(event.source!==window.parent || event.data?.type!=="shisheng:init" || !event.ports[0] || hostPort)return;
    hostPort=event.ports[0];
    hostPort.onmessage=event=>{
      const message=event.data;
      if(message?.type!=="saved")return;
      const pending=waiting.get(message.requestId);
      if(pending){clearTimeout(pending.timeout);waiting.delete(message.requestId);message.ok?pending.resolve():pending.reject(new Error("本机保存失败"));}
    };
    const saved=event.data.state||{};
    app=fresh();app.active="workbench";
    app.libraries=[{id:"workbench",name:event.data.label||"年度考核名单",rows:event.data.rows,progress:saved.progress||{},session:saved.session||null,exams:saved.exams||[],updated:Date.now()}];
    app.settings={className:"",order:"sequence",scope:"full",...saved.settings};
    if(!app.settings.orderChosen)app.settings.order="sequence";
    app.studyPlans=cleanStudyPlans(saved.studyPlans,event.data.rows.map(r=>r.id));app.activePlanId=saved.activePlanId||"";
    app.linkedSignatures=saved.signatures||{};
    if(app.settings.className && !rows().some(s=>s.className===app.settings.className))app.settings.className="";
    app.settings.filters=cleanOverviewFilters(saved.settings?.filters||{classes:app.settings.className?[app.settings.className]:[]});
    view="overview";render();
  });
  window.parent.postMessage({type:"shisheng:ready"},"*");
}

    const j = Math.floor(Math.random() * (i + 1));

};

function openDB() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open("shisheng-v2", 1);
    r.onupgradeneeded = () => {
      r.result.createObjectStore("app");
      r.result.createObjectStore("photos");
    };
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
function readStore(store, key) {
  return new Promise((resolve, reject) => {
    const r = dbase.transaction(store).objectStore(store).get(key);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
function transaction(state, photoWrites = [], photoDeletes = []) {
  return new Promise((resolve, reject) => {
    if (hostPort) { hostSave(state).then(resolve, reject); return; }
    if (!dbase) return reject(new Error("浏览器未提供本机存储"));
    const tx = dbase.transaction(["app", "photos"], "readwrite");
    tx.objectStore("app").put(state, "current");
    const p = tx.objectStore("photos");
    photoWrites.forEach(([k, b]) => p.put(b, k));
    photoDeletes.forEach((k) => p.delete(k));
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error("保存被中断"));
  });
}
function persist() {
  pendingSaves++;
  paintSave();
  const snapshot = structuredClone(hostPort ? {...app,libraries:app.libraries.map(({rows,...library})=>library)} : app);
  saving = saving
    .catch(() => {})
    .then(() => transaction(snapshot))
    .then(() => {
      storageError = "";
      paintSave();
      return true;
    })
    .catch((e) => {
      storageError =
        "本次更改未保存：" + e.message + "。请导出备份后再关闭页面。";
      paintSave();
      showToast(storageError);
      return false;
    })
    .finally(() => {
      pendingSaves--;
      paintSave();
    });
  return saving;
}
function paintSave() {
  const box = $("#save-status");
  if (box) {
    box.textContent =
      storageError ||
      (pendingSaves
        ? "正在保存本次进度…"
        : "考核材料已锁定 · 练习进度已保存在本机");
    box.classList.toggle("error", !!storageError);
  }
}

  for (const s of current.rows) {

async function startLearn(reviewOnly = false,selectedPlan=null,number=null) {

  const plan=selectedPlan||(reviewOnly?ensureStudyPlan(true):currentStudyPlan());
  if(!plan)return;
  const group=number||plan.cursor||nextStudyGroup(plan);
  const ids=plan.groups[group-1];if(!ids?.length){showToast("当前计划没有可学习分组。");return;}
  plan.cursor=group;plan.started=[...new Set([...plan.started,group])];plan.updatedAt=new Date().toISOString();app.activePlanId=plan.id;
  setSession({kind:"learn",scope:plan.scope,stage:"study",ids:[...ids],queue:[],index:0,revealed:false,missed:[],results:[],retries:{},reviewOnly,planId:plan.id,planGroup:group});
  if(!await persist())return;move("learn");

    .slice(0, 5)

}

  const run = session(),
    id = run.ids[run.index];

  p.viewedScopes=[...new Set([...(p.viewedScopes||[]),run.scope])];
  if(run.scope==="full"){p.viewed = true;p.rounds = (p.rounds || 0) + 1;}
  run.index++;
  if (run.index >= run.ids.length) {

async function grade(missed, skip = false) {

  p[run.scope] = {
    attempts: (p[run.scope]?.attempts || 0) + 1,
    last: missed.length ? "miss" : "good",
    missed: [...missed],
    at: Date.now(),
  };
  run.results.push({ id, missed: [...missed], skip });
  if (
    run.kind === "learn" &&
    missed.length &&
    !skip &&
    !run.retries[id] &&
    run.queue.length - run.index - 1 >= 2
  ) {
    run.retries[id] = 1;
    run.queue.splice(run.index + 3, 0, id);
  }
  run.index++;
  run.revealed = false;
  run.missed = [];
  if (run.index >= run.queue.length) {
    run.stage = "done";
    if(run.kind==="learn"&&run.planId){const index=app.studyPlans.findIndex(p=>p.id===run.planId);if(index>=0)app.studyPlans[index]=completeStudyGroup(app.studyPlans[index],run.planGroup,run.ids);}

      const history = lib()
        ? lib().exams || (lib().exams = [])
        : app.demoExams || (app.demoExams = []);
      history.unshift({
        at: Date.now(),
        scope: run.scope,
        results: structuredClone(run.results),
      });
      history.splice(20);
    }
  }
  await persist();

function parseFilename(rel) {
  const base = rel
    .split("/")
    .pop()
    .replace(/\.[^.]+$/, "");
  const parts = base.split("_").map((x) => x.trim());
  if (parts.length === 7 && parts[6] === "") parts.pop();
  let s = {
    name: "",
    className: "",
    studentNo: "",
    hometown: "",
    needyLabel: "非困难",
    psychLabel: "无关注",
    issues: [],
    confirmed: false,
  };
  if (parts.length === 6) {
    [s.className, s.name, s.studentNo] = parts;
    s.needyLabel = parts[3] || "非困难";
    s.psychLabel = parts[4] || "无关注";
    s.hometown = parts[5];
    if (!/^[0-9]{8,12}$/.test(s.studentNo)) s.issues.push("学号格式需核对");
    if (
      !["", "贫困", "困难", "非困难", "非贫困", "否", "无"].includes(parts[3])
    )
      s.issues.push("请核对贫困字段原文");
    if (
      !["", "心理重点关注", "心理关注", "无关注", "无", "否"].includes(parts[4])
    )
      s.issues.push("请核对心理字段原文");
  } else {
    s.name = /^[\u3400-\u9fff·]{2,12}$/.test(base) ? base : "";
    s.issues.push("文件名不是六段格式，请对照原文件核对");
  }
  if (!s.name) s.issues.push("姓名为空");
  if (!s.className) s.issues.push("班级为空");
  if (!s.hometown) s.issues.push("籍贯为空");
  s.confirmed = !s.issues.length;
  s.sure = s.confirmed;
  return s;
}
function checkDuplicates(list) {
  const counts = new Map();
  list.forEach((s) => {
    if (s.studentNo)
      counts.set(s.studentNo, (counts.get(s.studentNo) || 0) + 1);
  });
  for (const s of list) {
    s.issues = (s.issues || []).filter((x) => !x.startsWith("重复学号"));
    if (s.studentNo && counts.get(s.studentNo) > 1)
      s.issues.push("重复学号：" + s.studentNo + "，请保留正确记录或更正学号");
    s.sure = !!s.confirmed && !s.issues.length;
  }
}
function compress(file) {
  return new Promise((resolve, reject) => {
    const image = new Image(),
      url = URL.createObjectURL(file);
    image.onload = () => {
      try {
        const scale = Math.min(1, 720 / Math.max(image.width, image.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.width * scale));
        canvas.height = Math.max(1, Math.round(image.height * scale));
        canvas
          .getContext("2d")
          .drawImage(image, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(
          (blob) => {
            URL.revokeObjectURL(url);
            blob ? resolve(blob) : reject(new Error("压缩失败"));
          },
          "image/jpeg",
          0.82,
        );
      } catch (e) {
        URL.revokeObjectURL(url);
        reject(e);
      }
    };
    image.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("照片无法读取"));
    };
    image.src = url;
  });
}

      removed.map((s) => photoKey(libraryId, s.id)),
    );
    await loadPhotos();
    rosterFilter = imported.some((s) => !s.sure) ? "pending" : "all";
    query = "";
    move(rosterFilter === "pending" ? "roster" : "home");
    showToast(report[0]);
  } finally {
    busyUI("");
    importTarget = null;
  }
}
function editStudent(id) {
  const s = rows().find((s) => s.id === id);
  if (!s || !lib()) return;
  editing = id;
  const dialog = $("#editor");
  dialog.innerHTML = `<h2>核对词条</h2><p style="font-size:13px;overflow-wrap:anywhere;margin:12px 0">原文件：${esc(s.rel)}</p><p class="muted" style="font-size:13px">按文件名原文核对，贫困、心理留空会按“无”处理。</p><form id="edit-form"><div class="editgrid">${[...FIELDS, ["studentNo", "学号（仅用于区分记录，不背）"]].map(([k, label]) => `<label class="field">${label}<input type="text" name="${k}" value="${esc(s[k])}" ${["name", "className", "hometown"].includes(k) ? "required" : ""}></label>`).join("")}</div><div class="actions"><button class="btn" type="submit">确认并保存</button><button class="btn secondary" type="button" data-action="close-edit">取消</button></div></form>`;
  dialog.showModal();
}
async function saveEdit(form) {
  const s = lib().rows.find((x) => x.id === editing),
    before = signature(s);
  const data = new FormData(form);
  const changes = {};
  for (const [k] of [...FIELDS, ["studentNo"]])
    changes[k] = String(data.get(k) || "").trim();
  if (!changes.name || !changes.className || !changes.hometown) {
    showToast("姓名、班级和籍贯需要填写。");
    return;
  }
  Object.assign(s, changes);
  s.needyLabel = s.needyLabel || "非困难";
  s.psychLabel = s.psychLabel || "无关注";
  s.confirmed = true;
  s.manual = true;
  s.issues = [];
  checkDuplicates(lib().rows);
  if (before !== signature(s)) {
    delete lib().progress[s.id];
    lib().session = null;
  }
  if (!(await persist())) return;
  $("#editor").close();
  render();
  showToast(
    s.sure ? "词条已保存，可以开始学习。" : "已保存，仍需处理重复学号。",
  );
}
async function toDataURL(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}
async function exportLibrary(id) {
  busyUI("正在打包本机名册");
  try {
    await saving;
    const l = app.libraries.find((x) => x.id === id);
    const data = structuredClone(l);
    for (const row of data.rows) {
      const blob = await readStore("photos", photoKey(id, row.id));
      if (!blob) throw new Error("照片缺失：" + row.rel);
      row.image = await toDataURL(blob);
    }
    const blob = new Blob(
      [
        JSON.stringify({
          format: "shisheng-backup",
          version: 2,
          library: data,
        }),
      ],
      { type: "application/json" },
    );
    const url = URL.createObjectURL(blob),
      a = document.createElement("a");
    a.href = url;
    a.download = l.name.replace(/[\\/:*?"<>|]/g, "_") + "-识生备份.json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    showToast("备份已导出，内含照片与学习进度。");
  } finally {
    busyUI("");
  }
}
async function restoreBackup(file) {
  if (!file) return;
  busyUI("正在检查备份");
  try {
    if (file.size > 250 * 1024 * 1024)
      throw new Error("备份超过 250 MB，请拆分名册后恢复");
    const data = JSON.parse(await file.text());
    if (
      data.format !== "shisheng-backup" ||
      data.version !== 2 ||
      !data.library ||
      !Array.isArray(data.library.rows) ||
      !data.library.rows.length ||
      data.library.rows.length > 2000
    )
      throw new Error("不是受支持的识生备份");
    const raw = data.library;
    const id = uid(),
      list = [],
      writes = [],
      ids = new Set();
    for (const r of raw.rows) {
      if (
        typeof r.id !== "string" ||
        ids.has(r.id) ||
        typeof r.image !== "string" ||
        !/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(r.image)
      )
        throw new Error("备份中的照片或记录格式无效");
      ids.add(r.id);
      const binary = atob(r.image.split(",")[1]),
        bytes = Uint8Array.from(binary, (c) => c.charCodeAt(0)),
        b = new Blob([bytes], { type: r.image.slice(5, r.image.indexOf(";")) });
      const clean = {
        id: r.id,
        rel: String(r.rel || ""),
        studentNo: String(r.studentNo || ""),
        confirmed: !!r.confirmed,
        manual: !!r.manual,
        issues: Array.isArray(r.issues) ? r.issues.map(String) : [],
        stamp: String(r.stamp || ""),
      };
      FIELDS.forEach(([k]) => (clean[k] = String(r[k] || "")));
      if (!clean.name || !clean.className || !clean.hometown) {
        clean.confirmed = false;
        clean.issues.push("备份词条不完整");
      }
      list.push(clean);
      const bitmap = await createImageBitmap(b);
      bitmap.close();
      writes.push([photoKey(id, r.id), b]);
    }
    checkDuplicates(list);
    const restoredProgress = {};
    for (const row of list) {
      const p = raw.progress?.[row.id];
      if (!p || typeof p !== "object") continue;
      const clean = {
        viewed: !!p.viewed,
        rounds: Number.isFinite(p.rounds) ? Math.max(0, p.rounds) : 0,
      };
      for (const scope of Object.keys(SCOPES)) {
        const r = p[scope];
        if (r && ["good", "miss"].includes(r.last))
          clean[scope] = {
            last: r.last,
            attempts: Number.isFinite(r.attempts) ? Math.max(0, r.attempts) : 0,
            at: Number.isFinite(r.at) ? r.at : 0,
            missed: Array.isArray(r.missed)
              ? r.missed.filter((k) =>
                  fieldSet(scope).some(([key]) => key === k),
                )
              : [],
          };
      }
      restoredProgress[row.id] = clean;
    }
    const name = String(raw.name || "恢复的名册");
    const next = structuredClone(app);
    let restoredSession = null;
    const rs = raw.session;
    if (
      rs &&
      ["learn", "exam"].includes(rs.kind) &&
      ["study", "recall", "done"].includes(rs.stage) &&
      Object.keys(SCOPES).includes(rs.scope) &&
      Array.isArray(rs.ids) &&
      rs.ids.length <= 6 &&
      rs.ids.every((x) => ids.has(x)) &&
      Array.isArray(rs.queue) &&
      rs.queue.length <= 12 &&
      rs.queue.every((x) => ids.has(x)) &&
      Number.isInteger(rs.index) &&
      rs.index >= 0 &&
      rs.index <= (rs.stage === "study" ? rs.ids.length : rs.queue.length) &&
      Array.isArray(rs.results)
    ) {
      restoredSession = {
        ...rs,
        missed: Array.isArray(rs.missed)
          ? rs.missed.filter((k) => FIELDS.some(([key]) => key === k))
          : [],
        retries: rs.retries && typeof rs.retries === "object" ? rs.retries : {},
        results: rs.results
          .filter((r) => r && ids.has(r.id) && Array.isArray(r.missed))
          .map((r) => ({
            id: r.id,
            missed: r.missed.filter((k) => FIELDS.some(([key]) => key === k)),
            skip: !!r.skip,
          })),
      };
      if (
        rs.stage !== "done" &&
        rs.index === (rs.stage === "study" ? rs.ids.length : rs.queue.length)
      )
        restoredSession = null;
    }
    const exams = (Array.isArray(raw.exams) ? raw.exams : [])
      .slice(0, 20)
      .filter(
        (h) =>
          h &&
          Number.isFinite(h.at) &&
          Object.keys(SCOPES).includes(h.scope) &&
          Array.isArray(h.results),
      )
      .map((h) => ({
        at: h.at,
        scope: h.scope,
        results: h.results
          .filter(
            (r) => r && typeof r.id === "string" && Array.isArray(r.missed),
          )
          .slice(0, 5)
          .map((r) => ({
            id: r.id,
            missed: r.missed.filter((k) =>
              fieldSet(h.scope).some(([key]) => key === k),
            ),
            skip: !!r.skip,
          })),
      }));
    next.libraries.push({
      id,
      name,
      rows: list,
      progress: restoredProgress,
      legacy:
        raw.legacy && typeof raw.legacy === "object" ? raw.legacy : undefined,
      session: restoredSession,
      exams,
      updated: Date.now(),
      report: ["从备份恢复为独立名册，原有名册未覆盖。"],
    });
    next.active = id;
    next.settings.className = "";
    await install(next, writes);
    await loadPhotos();
    move("home");
    showToast("备份已恢复，照片和学习进度已载入。");
  } finally {
    busyUI("");
  }
}
async function migrateLegacy() {
  if (app.legacyChecked) return;
  let old;
  try {
    old = await new Promise((resolve, reject) => {
      const r = indexedDB.open("shisheng-folder");
      r.onupgradeneeded = () => {
        r.transaction.abort();
        resolve(null);
      };
      r.onerror = () =>
        r.error?.name === "AbortError" ? resolve(null) : reject(r.error);
      r.onsuccess = () => resolve(r.result);
    });
    if (
      old?.objectStoreNames.contains("kv") &&
      old.objectStoreNames.contains("photos")
    ) {
      const get = (store, key) =>
        new Promise((resolve, reject) => {
          const r = old.transaction(store).objectStore(store).get(key);
          r.onsuccess = () => resolve(r.result);
          r.onerror = () => reject(r.error);
        });
      const meta = await get("kv", "meta");
      if (meta?.files?.length) {
        const id = uid(),
          migrated = [],
          writes = [];
        for (const f of meta.files) {
          const blob = await get("photos", f.rel);
          if (!blob) continue;
          const row = {
            ...f,
            id: uid(),
            needyLabel: f.needyLabel || (f.needy ? "贫困" : "非困难"),
            psychLabel: f.psychLabel || (f.psychFocus ? "心理关注" : "无关注"),
            confirmed: !!f.sure,
            manual: !!f.fixed,
            issues: f.issues || [],
            stamp: "",
          };
          migrated.push(row);
          writes.push([photoKey(id, row.id), blob]);
        }
        if (migrated.length) {
          checkDuplicates(migrated);
          let legacy = {};
          try {
            legacy = JSON.parse(
              localStorage.getItem("shisheng-html-v1") || "{}",
            );
          } catch {}
          const next = structuredClone(app);
          next.libraries.push({
            id,
            name: meta.name || "旧版名册",
            rows: migrated,
            progress: {},
            exams: [],
            session: null,
            updated: Date.now(),
            legacy,
            report: [
              "已读取旧版照片和词条；旧熟练度已保留为历史，不计入新版成绩。",
            ],
          });
          next.active = id;
          next.legacyChecked = true;
          await install(next, writes);
          return;
        }
      }
    }
    app.legacyChecked = true;
    await persist();
  } finally {
    old?.close();
  }
}

const actions = {

async function handleClick(event) {
  if (busy) return;
  if(await handleStudyClick(event))return;
  if(await handleOverviewClick(event))return;
  const link=event.target.closest('a[href^="#"]');
  if(link){if(link.hasAttribute("data-pending"))rosterFilter="pending";move(link.getAttribute("href").slice(1));return;}
  const editTarget=event.target.closest("[data-edit]");
  if(editTarget){hostPort?.postMessage({type:"return",studentId:editTarget.dataset.edit});return;}
  const action = event.target.closest("[data-action]");
  if (action) {
    await actions[action.dataset.action]?.();
    return;
  }
  const scope = event.target.closest("[data-scope]");
  if (scope) {
    app.settings.scope = scope.dataset.scope;
    persist();
    render();
    return;
  }
  const filter = event.target.closest("[data-filter]");
  if (filter) {
    rosterFilter = filter.dataset.filter;
    render();
    return;
  }
  if (event.target.closest("[data-pending]")) {
    rosterFilter = "pending";
    if (view === "roster") render();
  }
  const edit = event.target.closest("[data-edit]");
  if (edit) {
    editStudent(edit.dataset.edit);
    return;
  }
  const use = event.target.closest("[data-use]");
  if (use) {
    await useLibrary(use.dataset.use);
    return;
  }
  const update = event.target.closest("[data-update]");
  if (update) {
    importTarget = update.dataset.update;
    $("#folder").value = "";
    $("#folder").click();
    return;
  }
  const exp = event.target.closest("[data-export]");
  if (exp) await exportLibrary(exp.dataset.export);
}
